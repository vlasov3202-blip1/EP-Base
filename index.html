<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090a" />
    <meta name="description" content="EINEIRO — Market, Business and Admin" />
    <title>EINEIRO</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="eineiro-skin.css" />
    <link rel="stylesheet" href="eineiro-core.css" />
    <link rel="stylesheet" href="surfaces.css" />
    <link rel="stylesheet" href="market-catalog.css" />
    <link rel="stylesheet" href="scene-slots.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const host = location.hostname.toLowerCase();
      const preview = new URLSearchParams(location.search).get('surface');
      const surface = preview || (host.startsWith('admin.') ? 'admin' : host.startsWith('business.') || host.startsWith('cabinet.') ? 'business' : 'market');
      document.title = surface === 'market' ? 'EINEIRO Market' : surface === 'admin' ? 'EINEIRO Admin' : 'EINEIRO Business';
      if (surface === 'business') {
        await import('./app.js');
        await import('./business-addons.js');
      } else {
        await import(surface === 'market' ? './market.js' : './admin.js');
      }
    </script>
  </body>
</html>
